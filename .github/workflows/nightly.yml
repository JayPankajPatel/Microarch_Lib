# Nightly regression: set up the pixi toolchain from the lockfile, then run
# lint, every cocotb testbench, and every SymbiYosys proof.
# Scheduled runs only trigger from the default branch.
name: Nightly Regression

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (locked)
        run: pixi install --locked

      - name: Install SymbiYosys
        run: pixi run setup-sby

      - name: Install Bender
        # The Bender init script installs the binary to ~/.cargo/bin
        run: |
          pixi run setup-bender
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check Bender
        run: |
          bender --version
          bender checkout

      - name: Lint
        run: pixi run lint-all

      - name: cocotb regression
        run: pixi run run-regression

      - name: Formal
        run: pixi run run-formal
