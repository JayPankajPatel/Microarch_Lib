# A more detailed description of the manifest format `Bender.yml` can be found here:
# https://github.com/pulp-platform/bender#manifest-format-benderyml

package:
  name: Microarch_Lib
  authors:
    - "JayPankajPatel <jayp102501@gmail.com>"

dependencies:

sources:
  # Single source group: include_dirs applies to every file below via `` `include ``,
  # and Bender/Verilator resolve inter-module dependencies from the design graph, not
  # from file order, so one flat group is sufficient for a single-package repo like this.
  - include_dirs:
      - common/rtl
    files:
      - blocks/basic/rtl/*.sv
      - blocks/stochastic/pnr/*.sv
      - blocks/stochastic/rtl/*.sv



  # Verification-only sources (ADR 0025): reusable checkers and per-block bind
  # files. Gated behind the `formal` target so they never appear in the
  # default (synthesis) file list; select with `bender ... -t formal`.
  - target: formal
    include_dirs:
      - common/rtl
    files:
      - common/verif/sva/*.sv
      - blocks/*/verif/formal/*/*_bind.sv
