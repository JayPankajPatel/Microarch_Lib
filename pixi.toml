[workspace]
authors = ["JayPankajPatel <jayp102501@gmail.com>"]
channels = ["conda-forge"]
name = "Microarch_Lib"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
setup-sby = "rm -rf /tmp/sby-src-microarch && git clone --depth 1 https://github.com/YosysHQ/sby /tmp/sby-src-microarch && make -C /tmp/sby-src-microarch install PREFIX=$CONDA_PREFIX && rm -rf /tmp/sby-src-microarch"
lint = "bash -c 'cd \"$PIXI_PROJECT_ROOT\" && INCDIRS=$(bender script flist-plus --only-includes) && SOURCES=$(bender script flist-plus --only-sources); cd \"$INIT_CWD\" && MOD=$(grep -oP \"(?<=^module )\\w+\" \"$1\" | head -1) && exec verilator --lint-only -Wall $INCDIRS $SOURCES --top-module \"$MOD\"' _"
lint-all = "bash -c 'cd \"$PIXI_PROJECT_ROOT\" && INCDIRS=$(bender script flist-plus --only-includes) && SOURCES=$(bender script flist-plus --only-sources); cd \"$INIT_CWD\" && exec verilator --lint-only -Wall $INCDIRS $SOURCES \"$@\"' _"
sweep-widths = "bash -c 'cd \"$INIT_CWD\" && exec \"$PIXI_PROJECT_ROOT/scripts/sweep_widths.sh\" \"$@\"' _"
run-regression = "bash -c 'exec \"$PIXI_PROJECT_ROOT/scripts/run_regression.sh\"'"
render-waveform = "bash -c 'cd \"$INIT_CWD\" && exec \"$PIXI_PROJECT_ROOT/scripts/render_waveform.sh\" \"$@\"' _"
formal = "bash -c 'cd \"$INIT_CWD\" && SBY_REL=$(realpath --relative-to=\"$PIXI_PROJECT_ROOT\" \"$1\") && cd \"$PIXI_PROJECT_ROOT\" && BASENAME=$(basename \"$SBY_REL\" .sby) && exec sby -f \"$SBY_REL\" --prefix \"build/formal/$BASENAME\"' _"

[dependencies]
verilator = ">=5.50,<6"
yosys = ">=0.67,<0.68"
click = ">=8.4.2,<9"
libz3 = ">=4.16.0,<5"
cocotb = ">=2.0.1,<3"
ty = ">=0.0.70,<0.0.71"
pytest = ">=9.1.1,<10"

[pypi-dependencies]
pylfsr = ">=1.0.7, <2"
wavedrom = ">=2.0.3.post3, <3"

