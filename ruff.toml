# Ruff configuration (Python verification code: common/verif, blocks/*/verif,
# scripts). Pinned here so results do not depend on any user-level ruff
# config. See docs/adr/0026.
target-version = "py312"
line-length = 88
# Ruff >= 0.16 also formats Python blocks inside Markdown; keep it off the
# ADRs and docs so formatting never rewrites design records.
extend-exclude = ["*.md"]

[lint]
# Ruff defaults (pycodestyle errors E4/E7/E9, Pyflakes F) plus import sorting.
extend-select = ["I"]

[lint.isort]
known-first-party = ["axis_struct", "axis_tb", "base_tb", "ma_clkrst"]
